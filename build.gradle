plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

group = 'com.mimic.monster'
version = '1.0.0'
archivesBaseName = 'monstermod'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'mixin.env.disableRefMap', 'false'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.kosmx.dev/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.2.0"
    implementation fg.deobf('org.spongepowered:mixin:0.8.5_mapped_parchment_2023.09.03-1.20.1')
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
    implementation fg.deobf('dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20')
}

jar {
    manifest {
        attributes([
                "MixinConfigs": "monstermod.mixins.json"
        ])
    }
}

sourceSets.main.resources {
    srcDir 'src/main/resources'
    exclude '**/*.cache'
}

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    inputs.property "version", project.version
    inputs.property "mcversion", '1.20.1'

    from(sourceSets.main.resources.srcDirs) {
        include 'META-INF/mods.toml'
        expand(
                'mod_id': archivesBaseName,
                'mod_version': version,
                'minecraft_version': '1.20.1'
        )
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'META-INF/mods.toml'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}