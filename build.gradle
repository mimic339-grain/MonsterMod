plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'maven-publish'
    id 'eclipse'
}

// ==========================
// Mod 情報
// ==========================
group = 'com.mimic.monstermod'
version = '1.0.0'
archivesBaseName = 'monstermod'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// ==========================
// Minecraft / Forge 設定
// ==========================
minecraft {
    // Mappings
    mappings channel: 'official', version: '1.20.1'
    // Forge runs
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // GeckoLib の renderer デバッグ
            jvmArgs '-Dgeckolib.debug_renderers=true'

            mods {
                monstermod {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            mods {
                monstermod {
                    source sourceSets.main
                }
            }
        }
    }
}

// ==========================
// Mixin 設定
// ==========================
mixin {
    add sourceSets.main, "monstermod.refmap.json"
    config "monstermod.mixins.json"
}

// ==========================
// リポジトリ
// ==========================
repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }

    // KosmX Player Animator
    maven { url = 'https://maven.kosmx.dev/' }
}

// ==========================
// 依存関係
// ==========================
dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.10"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20")
}

// ==========================
// Jar 設定
// ==========================
jar {
    manifest {
        attributes([
                "MixinConfigs": "monstermod.mixins.json"
        ])
    }
}

// ==========================
// Resources 設定
// ==========================
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.cache'
}

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    inputs.property "version", project.version
    inputs.property "mcversion", '1.20.1'

    from(sourceSets.main.resources.srcDirs) {
        include 'META-INF/mods.toml'

        expand(
                mod_id: 'monstermod',
                mod_name: 'Monster Mod',
                mod_license: 'All Rights Reserved',
                mod_version: project.version,
                mod_group_id: 'com.mimic.monstermod',
                mod_authors: 'mimic',
                mod_description: 'A mod that uses Mixin with GeckoLib and Forge 1.20.1.',
                minecraft_version: '1.20.1',
                forge_version: '47.4.10',
                forge_version_range: '47.4.10',
                minecraft_version_range: '1.20.1'
        )
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'META-INF/mods.toml'
    }
}

// ==========================
// Java コンパイル設定
// ==========================
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
