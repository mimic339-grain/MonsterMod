buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
    id 'maven-publish'
    id 'eclipse'
}

apply plugin: 'org.spongepowered.mixin'

// ==========================
// Mod 情報
// ==========================
group = 'com.mimic.monstermod'
version = '1.0.0'
archivesBaseName = 'monstermod'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// ==========================
// Minecraft / Forge
// ==========================
minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            jvmArgs '-Dgeckolib.debug_renderers=true'
            mods {
                monstermod { source sourceSets.main }
            }
        }
        // 2人目のクライアント。
        // プレイヤー同士のやりとり(血石・スキル・ボスバー・ボマー)は
        // 1人では確かめようがないので、別名・別フォルダでもう1つ立ち上げられるようにしてある。
        // 使い方: runClient で1つ目を起動 → ワールドをLANに公開 →
        //         runClient2 で2つ目を起動して、マルチプレイからそのLANワールドへ参加する。
        client2 {
            parent minecraft.runs.client
            workingDirectory project.file('run2')
            args '--username', 'Dev2'
            mods {
                monstermod { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            mods {
                monstermod { source sourceSets.main }
            }
        }
    }
}

// ==========================
// Mixin → refmap自動生成
// ==========================
mixin {
    add sourceSets.main, "monstermod.refmap.json"
    config "monstermod.mixins.json"
}

tasks.named("compileJava") {
    options.annotationProcessorPath = configurations.annotationProcessor
}

// ==========================
// リポジトリ
// ==========================
repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://cursemaven.com' }
}

// ==========================
// 依存関係
// ==========================
dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.10"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20")
    /*implementation fg.deobf("curse.maven:epic-fight-mod-405076:7210297")*/
}

// ==========================
// Jar
// ==========================
jar {
    manifest {
        attributes([
                "MixinConfigs": "monstermod.mixins.json"
        ])
    }
}

// ==========================
// Resources
// ==========================
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.cache'
}

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    inputs.property "version", project.version
    inputs.property "mcversion", '1.20.1'

    from(sourceSets.main.resources.srcDirs) {
        include 'META-INF/mods.toml'
        expand(
                mod_id: 'monstermod',
                mod_name: 'Monster Mod',
                mod_license: 'All Rights Reserved',
                mod_version: project.version,
                mod_group_id: 'com.mimic.monstermod',
                mod_authors: 'mimic',
                mod_description: 'A mod that uses Mixin with GeckoLib and Forge 1.20.1.',
                minecraft_version: '1.20.1',
                forge_version: '47.4.10',
                forge_version_range: '47.4.10',
                minecraft_version_range: '1.20.1'
        )
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'META-INF/mods.toml'
    }
}

// ==========================
// Java
// ==========================
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}